# Serena 읽기 전용 context. Claude Code에 붙일 때 --context로 이 파일 경로를 넘긴다.
# 형식: Serena v2.1.0 src/serena/resources/config/contexts/context.template.yml
# fixed_tools는 Serena 기본 도구 집합을 이 목록으로 바꾼다(같은 템플릿의 설명).
# 편집 도구, 셸 실행(execute_shell_command), 메모리 쓰기 도구는 넣지 않는다.
description: codeinside 읽기 전용(심볼 검색과 참조 찾기만)
prompt: |
  Serena is attached in read-only mode. Only symbol lookup and reference search tools are available.
  Use your own tools for reading files and searching text.
excluded_tools: []
included_optional_tools: []
fixed_tools:
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - find_declaration
  - find_implementations
tool_description_overrides: {}
single_project: true
structured_tool_output: false
